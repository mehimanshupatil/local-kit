name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CI: false

jobs:
  # Runs on PRs and on main. No deploy environment here: the github-pages environment only
  # allows main, and attaching it to this job made GitHub reject PR runs before any step ran.
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: "read"
    strategy:
      matrix:
        node-version: [24]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          pnpm install
      - name: Typecheck
        run: |
          pnpm run typecheck
      - name: Unit tests
        run: |
          pnpm run test
      - name: Install Playwright browsers
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: |
          pnpm run test:e2e
      - name: Build the app
        run: |
          pnpm run build

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload build directory content
          path: "dist/"

  # Only main deploys, and only after the test job (typecheck, unit, e2e, build) has passed
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: "write"
      id-token: "write"

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
